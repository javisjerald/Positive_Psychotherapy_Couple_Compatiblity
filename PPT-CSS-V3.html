<head>

<style>
:root{--green:#244c40;--sage:#e8efe8;--ink:#24372f;--paper:#faf8f2;--line:#d5ded5;--red:#9a2636;--gold:#e9d69d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,Arial,sans-serif}
header{background:var(--green);color:white;padding:30px max(24px,calc((100vw - 1060px)/2));display:flex;gap:18px;align-items:center}

main{max-width:1100px;margin:auto;padding:24px}h2{font-size:28px;line-height:1.25;margin-top:0}h3{margin-bottom:12px}p{margin:8px 0 16px}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button,select,textarea{font:inherit}button{border:1px solid #9cac9f;border-radius:8px;padding:11px 18px;background:var(--sage);color:var(--green);cursor:pointer;font-weight:650}

progress{width:100%;height:12px;accent-color:var(--green)}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--sage)}.bar{height:7px;background:#e4ebe5;width:110px;margin:4px 0}.bar span{display:block;height:100%;background:#547b68}

@media(max-width:650px){main{padding:12px}.card{padding:18px}.grid{grid-template-columns:1fr}.rankrow{grid-template-columns:1fr}header{padding:22px 18px}.choice{flex:1 1 42%}th,td{padding:7px 5px}}
@page{size:A4;margin:15mm}
@media print{body{background:white;color:#111;font-size:10pt}header{background:white;color:#111;padding:0 0 12px;border-bottom:2px solid #555}header p{color:#333}header h1{font-size:19pt}.icon{font-size:23px}main{max-width:none;padding:12px 0}.no-print,#home,#assessment,#storageStatus,#privateView{display:none!important}body:not(.printing-results) main:after{content:"Open Print Results after both partners are locked to print the report."}body:not(.printing-results) #results{display:none!important}.card{border:0;border-radius:0;padding:0;margin-bottom:18px;box-shadow:none}h2{font-size:17pt}h3{break-after:avoid}tr,.stage,.note{break-inside:avoid}table{font-size:9pt}thead{display:table-header-group}.table-wrap{overflow:visible}.notice{padding:8px;border:1px solid #888;background:white}.grid{display:block}.print-note{display:block}textarea{display:none}.report-only{display:block}.bar{background:#eee!important;print-color-adjust:exact}.bar span{background:#547b68!important;print-color-adjust:exact}}
</style>

<body>
<header><span class="icon" aria-hidden="true">👫</span><div><h1>PPT-CSS Couple Assessment</h1><p>Positive Psychotherapy Compatibility &amp; Safety Screening · V3</p></div></header>
<main>
<div id="storageStatus" class="small no-print" role="status"></div>
<section id="home" class="card"></section>
<section id="assessment" class="card hidden"></section>
<section id="results" class="hidden"></section>
<section id="privateView" class="card hidden"></section>
</main>
<script>
'use strict';
const QUESTIONS=[{"id":1,"text":"I feel loved and emotionally valued by my partner."},{"id":2,"text":"I can express affection toward my partner comfortably."},{"id":3,"text":"My partner's way of showing love generally matches what I need."},{"id":4,"text":"We can remain caring toward each other even during disagreement."},{"id":5,"text":"My partner allows me time to explain myself."},{"id":6,"text":"We can tolerate each other's weaknesses without quickly becoming critical."},{"id":7,"text":"When one of us makes a mistake, the other can respond patiently."},{"id":8,"text":"Our expectations regarding patience are reasonably similar."},{"id":9,"text":"We make adequate time for one another."},{"id":10,"text":"I am satisfied with the amount of meaningful time we spend together."},{"id":11,"text":"We respect each other's need for both togetherness and personal time."},{"id":12,"text":"Conflicts about work, phone use, hobbies or family do not repeatedly deprive our relationship of needed time."},{"id":13,"text":"I enjoy talking and sharing experiences with my partner."},{"id":14,"text":"We can seek emotional contact after conflict."},{"id":15,"text":"I can approach my partner when I need support."},{"id":16,"text":"Our preferences for social contact and privacy are reasonably compatible."},{"id":17,"text":"I generally trust my partner."},{"id":18,"text":"My partner behaves in ways that support trust."},{"id":19,"text":"I feel able to be emotionally vulnerable with my partner."},{"id":20,"text":"When trust is damaged, we can discuss and repair it."},{"id":21,"text":"I can imagine a positive future with my partner."},{"id":22,"text":"During difficulties, we generally believe that improvement is possible."},{"id":23,"text":"My partner encourages rather than destroys my hope."},{"id":24,"text":"We can work toward solutions instead of assuming the relationship is doomed."},{"id":25,"text":"We respect each other's religious, spiritual or philosophical beliefs."},{"id":26,"text":"Differences in belief can be discussed without ridicule or coercion."},{"id":27,"text":"We have sufficient agreement about the role of religion/spirituality in family life."},{"id":28,"text":"Our deeper values provide some shared meaning to the relationship."},{"id":29,"text":"I can ask difficult questions about our relationship without being punished."},{"id":30,"text":"My partner can tolerate uncertainty without demanding complete control."},{"id":31,"text":"I generally feel secure about my place in this relationship."},{"id":32,"text":"We can question assumptions and reconsider decisions when necessary."},{"id":33,"text":"I experience us as a team while remaining an individual."},{"id":34,"text":"Important decisions usually include both partners."},{"id":35,"text":"We can support one another without becoming excessively dependent."},{"id":36,"text":"Our sense of “we” leaves enough room for “I.”"},{"id":37,"text":"We can communicate respectfully about physical affection and sexual needs."},{"id":38,"text":"Affection and intimacy occur with mutual willingness."},{"id":39,"text":"Differences in sexual needs can be discussed without humiliation or pressure."},{"id":40,"text":"Physical intimacy generally contributes to connection rather than fear or obligation."},{"id":41,"text":"We have reasonably similar expectations about being on time."},{"id":42,"text":"Lateness does not repeatedly become a major conflict."},{"id":43,"text":"Our expectations regarding cleanliness are compatible."},{"id":44,"text":"Neither partner uses cleanliness standards to humiliate or control the other."},{"id":45,"text":"We can agree about how our home and responsibilities should be organized."},{"id":46,"text":"Differences between order and spontaneity are manageable."},{"id":47,"text":"We respect each other's ambitions and work commitments."},{"id":48,"text":"Achievement does not consistently take priority over our relationship."},{"id":49,"text":"I can generally rely on my partner to tell me the truth."},{"id":50,"text":"Difficult truths can be discussed without deliberate deception."},{"id":51,"text":"We have reasonably compatible attitudes toward saving and spending."},{"id":52,"text":"Important financial decisions are made transparently."},{"id":53,"text":"We have compatible expectations about doing things carefully."},{"id":54,"text":"Perfectionism or carelessness does not repeatedly damage our relationship."},{"id":55,"text":"My partner generally keeps important agreements."},{"id":56,"text":"I can depend on my partner when I genuinely need help."},{"id":57,"text":"Responsibilities are distributed in a way we can discuss as fair."},{"id":58,"text":"Both partners' needs receive serious consideration."},{"id":59,"text":"We maintain basic respect even when angry."},{"id":60,"text":"We avoid contempt, ridicule and deliberate humiliation."},{"id":61,"text":"We respect each other's health and physical needs."},{"id":62,"text":"Our expectations about rest, food, exercise, appearance and bodily comfort are manageable."},{"id":63,"text":"We can discuss health concerns without ridicule or excessive control."},{"id":64,"text":"Physical affection generally feels safe and welcome."},{"id":65,"text":"Our attitudes toward work and achievement are compatible enough for family life."},{"id":66,"text":"Household and practical responsibilities can be negotiated."},{"id":67,"text":"Neither person's career automatically dominates every major decision."},{"id":68,"text":"We support each other's growth and competence."},{"id":69,"text":"We agree sufficiently about time with friends and relatives."},{"id":70,"text":"Extended-family involvement can be discussed and bounded when necessary."},{"id":71,"text":"Neither partner is routinely isolated from supportive people."},{"id":72,"text":"We maintain enough couple/family contact despite outside commitments."},{"id":73,"text":"We have compatible ideas about our future together."},{"id":74,"text":"We can discuss dreams and long-term goals openly."},{"id":75,"text":"Our views about meaning, spirituality or purpose can coexist constructively."},{"id":76,"text":"We can plan for the future without one partner imposing the entire plan."},{"id":77,"text":"My partner respects my individuality."},{"id":78,"text":"I can express personal needs without excessive guilt."},{"id":79,"text":"Both of us can care for ourselves without interpreting independence as rejection."},{"id":80,"text":"We can discuss what we learned about marriage from our parents/caregivers."},{"id":81,"text":"We recognize that our childhood relationship models may differ."},{"id":82,"text":"We are willing to change inherited patterns that damage our relationship."},{"id":83,"text":"We have compatible expectations about relatives, friends and community."},{"id":84,"text":"We can establish boundaries with extended family when necessary."},{"id":85,"text":"Neither family of origin is automatically given authority over our relationship."},{"id":86,"text":"We respect differences in religion, philosophy and worldview."},{"id":87,"text":"We have discussed how beliefs will influence major family decisions."},{"id":88,"text":"Neither partner uses religion, culture or tradition to silence the other's legitimate concerns."},{"id":89,"text":"I can disagree with my partner honestly without becoming deliberately hurtful."},{"id":90,"text":"I do not routinely suppress important concerns merely to maintain peace."},{"id":91,"text":"My partner can hear disagreement without treating it as disloyalty."},{"id":92,"text":"We can combine honesty with courtesy."},{"id":93,"text":"We can stop an argument before it becomes destructive."},{"id":94,"text":"After conflict, at least one of us can initiate repair."},{"id":95,"text":"We can apologize without using the apology to end discussion prematurely."},{"id":96,"text":"We can identify the actual issue instead of repeatedly attacking character."},{"id":97,"text":"We still notice positive qualities in each other during difficult periods."},{"id":98,"text":"We have successfully solved important problems together before."},{"id":99,"text":"Humor, affection, friendship or shared activities help restore our connection."},{"id":100,"text":"Both of us show some willingness to learn and change."},{"id":101,"text":"Children: We agree sufficiently about whether to have children."},{"id":102,"text":"Parenting: We have compatible ideas about discipline, affection, education and parental responsibility."},{"id":103,"text":"Money: We can create a mutually acceptable system for earning, spending, saving, debt and financial disclosure."},{"id":104,"text":"Career: We can support each other's work and career goals."},{"id":105,"text":"Residence: We have compatible expectations regarding where and with whom we will live."},{"id":106,"text":"Extended family: We have discussed responsibilities toward parents, siblings and relatives."},{"id":107,"text":"Religion/spirituality: We have discussed religious practice and its place in family life."},{"id":108,"text":"Sexuality/intimacy: We can discuss expectations regarding affection, sexual relationship, privacy and fidelity."},{"id":109,"text":"Lifestyle: We have sufficiently compatible expectations about leisure, travel, socializing, substances and daily routines."},{"id":110,"text":"Gender/family roles: We have discussed expectations concerning work, caregiving, domestic work and decision-making."},{"id":111,"text":"Illness/aging/caregiving: We can discuss responsibilities if a partner or parent becomes seriously ill."},{"id":112,"text":"Future meaning: We can identify at least some shared long-term values or life purposes."},{"id":113,"text":"I have been afraid of how my partner might react if I disagree."},{"id":114,"text":"My partner has deliberately intimidated me through shouting, threatening gestures, destroying objects or similar behavior."},{"id":115,"text":"My partner tries to control whom I see, where I go or whom I communicate with."},{"id":116,"text":"My partner demands passwords, checks devices, tracks me or monitors me in ways that make me uncomfortable or afraid."},{"id":117,"text":"My partner has pressured me to reduce or end contact with friends, relatives or supportive people."},{"id":118,"text":"My partner restricts my access to money, employment, bank information or essential resources in order to control me."},{"id":119,"text":"My partner has threatened to harm me, themselves, another person, children, pets or property in order to influence my behavior."},{"id":120,"text":"My partner has pushed, slapped, hit, kicked, choked/strangled, restrained, blocked my exit, used a weapon, or physically hurt me."},{"id":121,"text":"I have been pressured, threatened or forced into sexual activity that I did not freely want."},{"id":122,"text":"My partner repeatedly humiliates, insults, degrades or deliberately frightens me."},{"id":123,"text":"Jealousy has led to surveillance, accusations, restrictions or threatening behavior."},{"id":124,"text":"I worry about what my partner would do if I tried to separate or end the relationship."},{"id":125,"text":"Children or other dependents have witnessed, experienced or been drawn into frightening relationship conflicts."},{"id":126,"text":"I currently feel unsafe in this relationship."},{"id":127,"text":"I have at least one person outside the relationship whom I can contact for support."},{"id":128,"text":"I have reasonable access to my own money, documents, phone and transportation."},{"id":129,"text":"I can express disagreement without expecting retaliation."},{"id":130,"text":"My partner can accept responsibility for harmful behavior without automatically blaming me."},{"id":131,"text":"We can seek professional help when a problem exceeds our ability to manage it."},{"id":132,"text":"Both of us recognize that love does not justify violence, coercion or control."},{"id":133,"text":"We have at least some shared values that support dignity and mutual respect."},{"id":134,"text":"We have demonstrated the ability to repair relationship injuries."},{"id":135,"text":"Both of us have meaningful sources of hope outside the immediate conflict."},{"id":136,"text":"I retain a meaningful sense of personal identity within the relationship."}];
const KEY='ppt-css-v3-offline-1';
const PRIMARY=['Love / Emotional Warmth','Patience','Time','Contact','Trust','Hope','Faith / Meaning','Certainty & Doubt','Unity','Sexuality / Intimacy'];
const SECONDARY=['Punctuality','Cleanliness','Order','Diligence / Achievement','Honesty','Frugality / Thrift','Accuracy / Conscientiousness','Reliability','Justice / Fairness','Courtesy / Politeness'];
const PAGES=[
 ['Primary Capacities',1,40,'primary'],['Secondary Capacities',41,60,'secondary'],
 ['Balance Model',61,76],['Four Model Dimensions',77,88],['Key Conflict & Communication',89,96],
 ['Relationship Resources',97,100],['Future Compatibility',101,112],['Private Safety Screen',113,126],['Protective Factors',127,136]
];
const GROUPS=[
 ...PRIMARY.map((name,i)=>({name,start:1+i*4,end:4+i*4,type:'primary'})),
 ...SECONDARY.map((name,i)=>({name,start:41+i*2,end:42+i*2,type:'secondary'})),
 ...['Body / Senses','Achievement / Activities','Contact / Relationships','Future / Fantasy / Meaning'].map((name,i)=>({name,start:61+i*4,end:64+i*4,type:'balance'})),
 ...['I — Relationship to Self','YOU — Partnership Model','WE — Social Model','PRIMARY-WE / PRIMAL-WE — Meaning & Worldview'].map((name,i)=>({name,start:77+i*3,end:79+i*3,type:'models'})),
 {name:'Courtesy ↔ Honesty',start:89,end:92,type:'conflict'},{name:'Conflict Regulation',start:93,end:96,type:'conflict'},
 {name:'Relationship Resources',start:97,end:100,type:'resources'},{name:'Protective Factors',start:127,end:136,type:'protective'}
];
const FORMULATION=['Presenting issue','Actual conflict','Actual capacities involved','Capacity discrepancies','Positive interpretation','Balance Model','Model dimensions','Family concepts','Basic conflict','Inner conflict','Key conflict — Courtesy ↔ Honesty','Conflict-reaction channel','Resources','Safety — record confidentially outside shared notes','Therapeutic priorities'];
const STAGES=[
 ['Observation & Distancing','Describe the situation without blame; notice strengths and gain perspective.'],
 ['Inventory','Explore actual capacities, the four life areas, relationship models and learned family concepts.'],
 ['Situational Encouragement','Recognize existing efforts and resources; identify a manageable next step.'],
 ['Verbalization','Name needs and differences with courtesy and honesty, only when it is safe to do so.'],
 ['Broadening of Goals','Develop shared and individual goals beyond the immediate conflict; review progress.']
];
const SCALE=['Not true at all','Rarely true','Sometimes true','Mostly true','Very true / consistently true'];
const SAFETY=['Never','Once / isolated','Occasionally','Repeatedly','Currently / frequently'];
const FUTURE={A:'Agree',U:'Unsure / not sufficiently discussed',D:'Significant disagreement'};
const DISCLAIMER='PPT-CSS is an original PPT-informed screening and formulation tool. It is not a standardized, normed or validated Peseschkian/WAPP psychometric instrument. It does not diagnose a condition, establish safety or predict relationship success.';
function empty(){return {answers:{},primaryRanks:{},secondaryRanks:{},locked:false};}
function fresh(){return {version:3,A:empty(),B:empty(),notes:{}};}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function range(a,b){return Array.from({length:b-a+1},(_,i)=>a+i);}
function validAnswer(id,v){return id>=101&&id<=112?['A','U','D'].includes(v):(Number.isInteger(v)&&v>=0&&v<=4)||((id<=100||id>=127)&&v==='NA');}
function rankNames(type){return type==='primary'?PRIMARY:SECONDARY;}
function rankValid(r,type){const entries=Object.entries(r);return entries.length===5&&entries.every(([k,v])=>rankNames(type).includes(k)&&Number.isInteger(v)&&v>=1&&v<=5)&&new Set(entries.map(x=>x[1])).size===5;}
function complete(p){return QUESTIONS.every(q=>validAnswer(q.id,p.answers[q.id]))&&rankValid(p.primaryRanks,'primary')&&rankValid(p.secondaryRanks,'secondary');}
function normalize(raw){
 const out=fresh();if(!raw||raw.version!==3)return out;
 for(const who of ['A','B']){
  const p=raw[who];if(!p||typeof p!=='object')continue;
  for(const q of QUESTIONS)if(validAnswer(q.id,p.answers?.[q.id]))out[who].answers[q.id]=p.answers[q.id];
  for(const type of ['primary','secondary']){const seen=new Set();for(const name of rankNames(type)){const v=p[type+'Ranks']?.[name];if(Number.isInteger(v)&&v>=1&&v<=5&&!seen.has(v)){out[who][type+'Ranks'][name]=v;seen.add(v);}}}
  out[who].locked=p.locked===true&&complete(out[who]);
 }
 if(!out.A.locked)out.B=empty();
 for(const key of [...FORMULATION.map((_,i)=>'f'+i),...STAGES.map((_,i)=>'s'+i)])if(typeof raw.notes?.[key]==='string')out.notes[key]=raw.notes[key];
 return out;
}
let storageWarning='',state=fresh(),partner='A',page=0,view='home';
try{const saved=localStorage.getItem(KEY);if(saved)state=normalize(JSON.parse(saved));}catch(e){storageWarning='Stored data could not be read. This session is not guaranteed to be saved.';}
function persist(){
 try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('storageStatus').textContent='Saved locally on this browser · '+new Date().toLocaleTimeString();return true;}
 catch(e){document.getElementById('storageStatus').textContent='Saving failed. Keep this window open; responses and notes may be lost when it closes.';return false;}
}
function available(p){return ['A','B'].includes(p)&&!state[p].locked&&(p==='A'||state.A.locked);}
function ready(){return state.A.locked&&state.B.locked&&complete(state.A)&&complete(state.B);}
function switchView(v){view=v;document.body.classList.toggle('printing-results',v==='results');for(const id of ['home','assessment','results','privateView'])document.getElementById(id).classList.toggle('hidden',id!==v);if(v!=='privateView')document.getElementById('privateView').innerHTML='';window.scrollTo({top:0,behavior:'instant'});}
function goHome(){renderHome();switchView('home');document.getElementById('assessment').innerHTML='';document.getElementById('results').innerHTML='';}
function renderHome(){
 document.getElementById('home').innerHTML='<div class="eyebrow">One couple · two perspectives</div><h2>Assessment control panel</h2><p>Complete each assessment separately. Answer according to how your relationship functions now. Each partner completes 136 items across nine pages, plus two top-five rankings.</p><div class="notice">'+DISCLAIMER+'</div><div class="controls"><button id="homePartnerA" class="primary" data-action="partner" data-partner="A" '+(state.A.locked?'disabled':'')+'>Partner A'+(state.A.locked?' · Locked':'')+'</button><button id="homePartnerB" class="primary" data-action="partner" data-partner="B" '+(!available('B')?'disabled':'')+'>Partner B'+(state.B.locked?' · Locked':'')+'</button><button id="homeResults" class="gold" data-action="results" '+(!ready()?'disabled':'')+'>Results Dashboard</button><button id="homePrint" data-action="print" '+(!ready()?'disabled':'')+'>Print Results</button></div><div class="grid">'+['A','B'].map(p=>'<div class="status"><b>Partner '+p+'</b><br>'+Object.keys(state[p].answers).length+' / 136 answered · '+(state[p].locked?'Complete and locked':p==='B'&&!state.A.locked?'Waiting for Partner A':'Ready to continue')+'</div>').join('')+'</div><p class="notice">'+(!state.A.locked?'Step 1: Complete and lock Partner A.':!state.B.locked?'Step 2: Partner A is locked. Partner B can now begin at Page 1.':'Both assessments are locked. Results and printing are available.')+'</p><details><summary>Privacy and local saving</summary><p>This file works offline and sends no responses anywhere. Responses and formulation notes are saved in this browser’s localStorage. Use a private, trusted device and the same file location and browser to resume. Private browsing, clearing browser data or moving the file may remove access to saved responses.</p><p><b>Locking prevents accidental editing; it is not encryption or password protection.</b> Anyone with access to this browser can potentially access the saved data. Safety results require a separate private view and are excluded from the shared printed report. Do not enter confidential safety disclosures into shared formulation notes.</p></details><hr><h3>Reset assessment</h3><p class="small">Reset A also clears B. Reset B preserves A. All resets clear shared formulation notes because the comparison changes.</p><div class="controls"><button class="danger" data-action="resetA">Reset A</button><button class="danger" data-action="resetB">Reset B</button><button class="danger" data-action="resetBoth">Reset Both</button></div>';
}
function openPartner(p){if(!available(p))return false;partner=p;page=0;renderPage();switchView('assessment');return true;}
function optionsFor(id){return id>=101&&id<=112?Object.entries(FUTURE):[...(id>=113&&id<=126?SAFETY:SCALE).map((s,i)=>[String(i),i+' — '+s]),...((id<=100||id>=127)?[['NA','N/A — Not applicable / insufficient information']]:[])];}
function questionHTML(q){
 const v=state[partner].answers[q.id];
 return '<fieldset id="q'+q.id+'" tabindex="-1"><legend>'+q.id+'. '+esc(q.text)+'</legend><div class="choices">'+optionsFor(q.id).map(([val,label])=>'<label class="choice"><input type="radio" name="q'+q.id+'" data-question="'+q.id+'" value="'+val+'" '+(String(v)===val?'checked':'')+'>'+esc(label)+'</label>').join('')+'</div></fieldset>';
}
function rankingHTML(type){
 const ranks=state[partner][type+'Ranks'];
 return '<div id="ranking" class="ranking" tabindex="-1"><h3>Rank Your Five Most Important '+(type==='primary'?'Primary':'Secondary')+' Capacities</h3><p>Choose exactly five capacities, assigning each rank 1–5 once. Rank 1 is most important. Reusing a rank immediately removes it from its previous capacity.</p><div id="rankStatus" role="status">'+Object.keys(ranks).length+' of 5 capacities ranked</div>'+rankNames(type).map((name,i)=>'<div class="rankrow"><label for="rank'+i+'">'+esc(name)+'</label><select id="rank'+i+'" data-rank="'+type+'" data-capacity="'+esc(name)+'"><option value="">Not ranked</option>'+[1,2,3,4,5].map(n=>{const other=Object.keys(ranks).find(k=>k!==name&&ranks[k]===n);return '<option value="'+n+'" '+(ranks[name]===n?'selected':'')+'>Rank '+n+(other?' — currently '+esc(other):'')+'</option>';}).join('')+'</select></div>').join('')+'</div>';
}
function renderPage(){
 const def=PAGES[page];
 document.getElementById('assessment').innerHTML='<div class="eyebrow">Partner '+partner+' · Page '+(page+1)+' of 9</div><h2>'+esc(def[0])+'</h2><div id="progressText" class="small"></div><progress id="progress" max="136" value="0" aria-label="Questions answered"></progress><div class="page-list">'+PAGES.map((x,i)=>'<span class="pill '+(i===page?'active':'')+'">'+(i+1)+'. '+esc(x[0])+'</span>').join('')+'</div>'+(page===7?'<div class="notice private"><b>Complete privately, without your partner watching.</b> Safety is assessed separately and never averaged into compatibility. If answering is unsafe, return Home and seek private support. If you are in immediate danger, contact local emergency services when safe to do so.</div>':'')+'<p class="small">'+(page===6?'Select Agree, Unsure / not sufficiently discussed, or Significant disagreement for each item.':page===7?'Use the separate frequency scale, 0 = Never to 4 = Currently / frequently.':'Use 0–4 or N/A. N/A counts as answered but is excluded from averages. Higher averages indicate stronger endorsement of these statements, not proof of compatibility.')+'</p><div id="pageError" class="error hidden" role="alert"></div>'+QUESTIONS.filter(q=>q.id>=def[1]&&q.id<=def[2]).map(q=>{const group=GROUPS.find(g=>g.start===q.id);return (group?'<h3>'+esc(group.name)+'</h3>':'')+questionHTML(q);}).join('')+(def[3]?rankingHTML(def[3]):'')+'<div class="controls nav no-print"><button data-action="home">Home</button><button data-action="previous" '+(page===0?'disabled':'')+'>Previous Page</button>'+(page<8?'<button class="primary" data-action="next">Next Page →</button>':'<button class="primary" id="lockButton" data-action="lock">Lock Partner '+partner+'</button>')+'</div>'+(page===8?'<p class="small">Locking prevents further editing. Changes after locking require resetting the assessment.</p>':'');
 updateProgress();
}
function updateProgress(){const count=Object.keys(state[partner].answers).length;document.getElementById('progressText').textContent=count+' of 136 answered';document.getElementById('progress').value=count;const lock=document.getElementById('lockButton');if(lock)lock.disabled=!complete(state[partner]);}
function setAnswer(id,v){if(!available(partner)||view!=='assessment'||!validAnswer(id,v))return false;state[partner].answers[id]=v;persist();document.getElementById('q'+id)?.classList.remove('missing');document.getElementById('pageError')?.classList.add('hidden');updateProgress();return true;}
function assignRank(p,type,name,value){
 if(!['primary','secondary'].includes(type)||!rankNames(type).includes(name))return false;
 const ranks=p[type+'Ranks'];if(value===''){delete ranks[name];return true;}
 const n=Number(value);if(!Number.isInteger(n)||n<1||n>5)return false;
 for(const key of Object.keys(ranks))if(key!==name&&ranks[key]===n)delete ranks[key];
 ranks[name]=n;return true;
}
function setRank(type,name,value){
 if(!available(partner)||!assignRank(state[partner],type,name,value))return;
 persist();const activeId=document.activeElement?.id;
 document.getElementById('ranking').outerHTML=rankingHTML(type);
 if(activeId)document.getElementById(activeId)?.focus({preventScroll:true});
 document.getElementById('pageError').classList.add('hidden');updateProgress();
}
function missingOn(p,index){const def=PAGES[index];return {ids:range(def[1],def[2]).filter(id=>!validAnswer(id,p.answers[id])),ranking:!!def[3]&&!rankValid(p[def[3]+'Ranks'],def[3])};}
function validatePage(){
 const m=missingOn(state[partner],page);if(!m.ids.length&&!m.ranking)return true;
 const box=document.getElementById('pageError');box.textContent=m.ids.length+' question'+(m.ids.length===1?' is':'s are')+' unanswered on this page.'+(m.ranking?' Assign exactly five capacities unique ranks 1, 2, 3, 4 and 5.':'')+' Complete the highlighted fields before continuing.';box.classList.remove('hidden');
 for(const id of m.ids)document.getElementById('q'+id).classList.add('missing');
 if(m.ranking)document.getElementById('ranking').classList.add('missing');
 const target=document.getElementById(m.ids.length?'q'+m.ids[0]:'ranking');target.scrollIntoView({behavior:'smooth',block:'center'});target.focus({preventScroll:true});return false;
}
function nextPage(){if(view!=='assessment'||!available(partner)||!validatePage())return false;if(page<8){page++;renderPage();window.scrollTo({top:0,behavior:'instant'});}return true;}
function lockPartner(){
 if(view!=='assessment'||!available(partner))return false;
 if(!complete(state[partner])){page=PAGES.findIndex((_,i)=>{const m=missingOn(state[partner],i);return m.ids.length||m.ranking;});renderPage();validatePage();return false;}
 if(!confirm('Lock Partner '+partner+'? Answers cannot be edited without resetting.'))return false;
 state[partner].locked=true;persist();goHome();return true;
}
function reset(which){
 if(!confirm(which==='B'?'Reset B and shared formulation notes? Partner A will be preserved.':'Reset '+(which==='A'?'A (and B)':'both partners')+'? All responses, rankings and notes will be deleted.'))return;
 if(which==='B'){state.B=empty();state.notes={};}else state=fresh();
 partner='A';page=0;persist();goHome();
}
function score(p,start,end){const vals=range(start,end).map(id=>p.answers[id]).filter(Number.isFinite);return {mean:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,n:vals.length,total:end-start+1};}
function fmt(v){return v===null?'N/A':v.toFixed(2);}
function gap(a,b){return a===null||b===null?null:Math.abs(a-b);}
function band(d){return d===null?'Insufficient numeric responses':d<=.5?'Strong similarity':d<=1?'Mild difference':d<=1.5?'Meaningful difference — explore':d<=2?'Strong discrepancy':'Major discrepancy — explore';}
function scoreCell(s){return '<b>'+fmt(s.mean)+'</b> <span class="small">('+s.n+'/'+s.total+')</span>'+(s.mean===null?'':'<div class="bar" aria-hidden="true"><span style="width:'+(s.mean/4*100)+'%"></span></div>');}
function comparison(groups,capacity=false){
 return '<div class="table-wrap"><table><thead><tr><th scope="col">Domain / items</th><th scope="col">Partner A</th><th scope="col">Partner B</th><th scope="col">Absolute gap</th>'+(capacity?'<th scope="col">Working interpretation</th>':'')+'</tr></thead><tbody>'+groups.map(g=>{const a=score(state.A,g.start,g.end),b=score(state.B,g.start,g.end),d=gap(a.mean,b.mean);return '<tr><th scope="row">'+esc(g.name)+'<br><span class="small">'+g.start+'–'+g.end+'</span></th><td>'+scoreCell(a)+'</td><td>'+scoreCell(b)+'</td><td>'+fmt(d)+'</td>'+(capacity?'<td>'+band(d)+'</td>':'')+'</tr>';}).join('')+'</tbody></table></div>';
}
function topRanks(type){return '<div class="grid">'+['A','B'].map(p=>'<div><h3>Partner '+p+'</h3><ol>'+Object.entries(state[p][type+'Ranks']).sort((a,b)=>a[1]-b[1]).map(([name])=>'<li>'+esc(name)+'</li>').join('')+'</ol></div>').join('')+'</div>';}
function notesHTML(key,label){return '<div class="note"><label for="note-'+key+'"><b>'+esc(label)+'</b></label><textarea id="note-'+key+'" data-note="'+key+'" placeholder="Therapist formulation — shared report notes">'+esc(state.notes[key]||'')+'</textarea><div id="print-'+key+'" class="print-note">'+esc(state.notes[key]||'No note recorded.')+'</div></div>';}
function safetyFlag(p){
 const positive=range(113,126).filter(id=>Number.isFinite(p.answers[id])&&p.answers[id]>0);
 const red=positive.filter(id=>[119,120,121,124,125,126].includes(id));
 return {level:red.length?'RED':positive.length?'AMBER':'NO DISCLOSURE',positive,red};
}
function showResults(){
 if(!ready())return false;
 const caps=GROUPS.filter(g=>g.type==='primary'||g.type==='secondary');
 const ordered=caps.map(g=>({...g,d:gap(score(state.A,g.start,g.end).mean,score(state.B,g.start,g.end).mean)})).filter(g=>g.d!==null).sort((a,b)=>b.d-a.d||a.start-b.start);
 const capList=list=>list.length?'<ol>'+list.map(g=>'<li><b>'+esc(g.name)+'</b> — gap '+fmt(g.d)+'; importance A: '+(state.A[g.type+'Ranks'][g.name]||'not ranked')+', B: '+(state.B[g.type+'Ranks'][g.name]||'not ranked')+'</li>').join('')+'</ol>':'<p>Insufficient numeric responses to compare capacities.</p>';
 document.getElementById('results').innerHTML='<div class="card"><div class="eyebrow">Both partners complete and locked</div><h2>Couple profile</h2><p>'+DISCLAIMER+'</p><div class="controls no-print"><button data-action="home">Home</button><button class="primary" data-action="print">Print Results / Save as PDF</button></div><div class="notice"><b>Descriptive profiles, no overall compatibility percentage.</b> Means and gaps range from 0 to 4. Counts in parentheses show numeric responses / total items. N/A is excluded, never scored as zero. Sparse or different response coverage limits comparisons; matching low scores are not a relationship strength. Future choices and safety disclosures are never averaged into these scores.</div><p class="report-only">Private safety results are excluded from this shared report.</p></div>'+
 '<div class="card"><h2>Primary Capacities</h2>'+comparison(caps.filter(g=>g.type==='primary'),true)+'<h3>Five most important Primary Capacities</h3>'+topRanks('primary')+'</div>'+
 '<div class="card"><h2>Secondary Capacities</h2>'+comparison(caps.filter(g=>g.type==='secondary'),true)+'<h3>Five most important Secondary Capacities</h3>'+topRanks('secondary')+'<p class="small">Working gap bands: 0–0.50 strong similarity; &gt;0.50–1.00 mild; &gt;1.00–1.50 meaningful; &gt;1.50–2.00 strong; &gt;2.00 major discrepancy. These are provisional discussion bands, not validated cutoffs. Bands use unrounded values.</p></div>'+
 '<div class="card"><h2>Five largest capacity differences</h2>'+capList(ordered.slice(0,5))+'<p class="small">Ties follow questionnaire order. Importance ranks help guide exploration; a difference is not itself pathology.</p><h3>Strongest similarities</h3>'+capList([...ordered].sort((a,b)=>a.d-b.d||a.start-b.start).slice(0,3))+'</div>'+
 [['balance','Balance Model'],['models','Four Model Dimensions'],['conflict','Courtesy–Honesty & Conflict Regulation'],['resources','Relationship Resources'],['protective','Protective Factors']].map(([type,title])=>'<div class="card"><h2>'+title+'</h2>'+comparison(GROUPS.filter(g=>g.type===type))+(type==='balance'?'<p>Can these differences coexist constructively? These ratings describe relationship functioning in each area, not time allocation.</p>':type==='models'?'<p>Where did each partner learn these patterns? Do inherited family concepts still serve the present relationship?</p>':type==='protective'?'<p>Protective factors do not cancel or reduce the significance of any safety disclosure.</p>':'')+'</div>').join('')+
 '<div class="card"><h2>Future Compatibility</h2><p>Discuss every unsure or disagreement response. Matching disagreement does not indicate agreement on the underlying life decision.</p><div class="table-wrap"><table><thead><tr><th>Topic</th><th>Partner A</th><th>Partner B</th><th>Discussion prompt</th></tr></thead><tbody>'+QUESTIONS.filter(q=>q.id>=101&&q.id<=112).map(q=>{const a=state.A.answers[q.id],b=state.B.answers[q.id];return '<tr><th scope="row">'+q.id+'. '+esc(q.text)+'</th><td>'+FUTURE[a]+'</td><td>'+FUTURE[b]+'</td><td>'+(a==='D'||b==='D'?'Explore the significant disagreement.':a==='U'||b==='U'?'Clarify expectations; discussion remains incomplete.':'Both report sufficient agreement; clarify practical details.')+'</td></tr>';}).join('')+'</tbody></table></div></div>'+
 '<div class="card no-print"><h2>Private safety results</h2><p>Review separately with each partner in a private setting. No safety answers or flags appear in the shared report. This separation is a viewing safeguard, not access security.</p><div class="controls"><button data-action="safety" data-partner="A">Review Partner A privately</button><button data-action="safety" data-partner="B">Review Partner B privately</button></div></div>'+
 '<div class="card"><h2>PPT formulation map</h2><p>Presenting issue → Actual conflict → Capacities → Differences → Positive interpretation → Balance → Model dimensions → Family concepts → Basic conflict → Inner conflict → Key conflict → Reaction channel → Resources → Safety → Therapeutic priorities.</p><p class="notice">Clinical hypotheses require contextual assessment. Positive interpretation must never justify coercion or violence. These notes are included in the shared printout; keep confidential safety documentation elsewhere.</p><button class="no-print" data-action="saveNotes">Save formulation notes locally</button><span id="noteStatus" class="small no-print" role="status"> Notes also save as you type.</span>'+FORMULATION.map((name,i)=>notesHTML('f'+i,(i+1)+'. '+name)).join('')+'</div>'+
 '<div class="card"><h2>Five therapeutic stages</h2><p>Adapt to clinical context and readiness. Safety assessment and appropriate support take priority over routine conjoint conflict work when concerns are disclosed.</p>'+STAGES.map(([name,desc],i)=>'<div class="stage"><h3>'+(i+1)+'. '+name+'</h3><p>'+desc+'</p>'+notesHTML('s'+i,'Plan / next step')+'</div>').join('')+'</div>'+
 '<div class="card"><h3>Scoring and provenance</h3><p class="small">All 136 item texts are preserved from the supplied PPT-CSS conversation. Items 1–100 and 127–136: 0–4 or N/A; 101–112: A/U/D; 113–126: separate frequency scale 0–4. Subscale means use available numeric responses only. The rankings use four independent partner/domain stores. This tool is an original formulation aid, not an official WAPP assessment.</p><p class="small">General private-support and safety principles: <a href="https://www.who.int/publications/i/item/WHO-RHR-14.26" target="_blank" rel="noopener noreferrer">WHO clinical handbook (2014)</a>. This reference does not validate the questionnaire or its screening rules. The app itself requires no internet connection.</p></div>';
 switchView('results');document.getElementById('assessment').innerHTML='';return true;
}
function showSafety(p){
 if(!ready()||!['A','B'].includes(p)||!confirm('Review Partner '+p+' alone in a private setting? This view contains sensitive disclosures and is not password protected.'))return false;
 const f=safetyFlag(state[p]);document.getElementById('privateView').innerHTML='<div class="eyebrow">Private · Partner '+p+'</div><h2>Separate safety screening</h2><div class="notice private"><b>'+f.level+'</b><p>'+(f.level==='RED'?'At least one serious safety concern is disclosed. Arrange a dedicated private safety assessment and appropriate safeguarding or emergency support; routine conjoint conflict work should not take priority.':f.level==='AMBER'?'At least one concerning experience is disclosed. Further private assessment is needed; do not assume ordinary couple conflict.':'No concerns were disclosed in these responses. This does not establish safety or rule out abuse.')+'</p><p>If danger is immediate, seek local emergency assistance when safe to do so. Disclosed strangulation, injury or sexual assault may require urgent medical assessment.</p></div><p>These conservative, unvalidated screening rules use any response above 0: items 119–121 and 124–126 flag RED; any other safety disclosure flags at least AMBER. The broad wording of an item cannot establish which specific behavior occurred, timing, severity or immediate danger. Follow up privately without inferring details.</p><div class="table-wrap"><table><thead><tr><th>Safety item</th><th>Partner '+p+' response</th></tr></thead><tbody>'+QUESTIONS.filter(q=>q.id>=113&&q.id<=126).map(q=>'<tr><th scope="row">'+q.id+'. '+esc(q.text)+'</th><td>'+state[p].answers[q.id]+' — '+SAFETY[state[p].answers[q.id]]+'</td></tr>').join('')+'</tbody></table></div><div class="controls"><button data-action="results">Close private view</button><button data-action="home">Home</button></div><p class="small">Never average these responses with relationship scores or use protective factors to cancel a disclosure. This view is excluded from printing.</p>';
 switchView('privateView');return true;
}
function printResults(){if(!showResults())return false;window.setTimeout(()=>window.print(),100);return true;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action;
 if(a==='partner')openPartner(b.dataset.partner);else if(a==='home')goHome();else if(a==='next')nextPage();else if(a==='previous'&&page>0){page--;renderPage();window.scrollTo(0,0);}else if(a==='lock')lockPartner();else if(a==='results')showResults();else if(a==='print')printResults();else if(a==='safety')showSafety(b.dataset.partner);else if(a==='resetA')reset('A');else if(a==='resetB')reset('B');else if(a==='resetBoth')reset('both');else if(a==='saveNotes'){const ok=persist();document.getElementById('noteStatus').textContent=ok?' Notes saved locally.':' Could not save notes; keep this window open.';}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.question){const id=Number(t.dataset.question);setAnswer(id,['NA','A','U','D'].includes(t.value)?t.value:Number(t.value));}else if(t.dataset.rank)setRank(t.dataset.rank,t.dataset.capacity,t.value);});
document.addEventListener('input',e=>{const key=e.target.dataset.note;if(key&&ready()){state.notes[key]=e.target.value;const ok=persist();document.getElementById('print-'+key).textContent=e.target.value||'No note recorded.';document.getElementById('noteStatus').textContent=ok?' Notes saved locally.':' Saving failed; keep this window open.';}});
if(QUESTIONS.length!==136||QUESTIONS.some((q,i)=>q.id!==i+1)||PAGES.flatMap(p=>range(p[1],p[2])).some((id,i)=>id!==i+1))throw new Error('Question numbering validation failed');
goHome();document.getElementById('storageStatus').textContent=storageWarning||'Offline app · responses and notes save in this browser';
</script>
</body>
</html>
